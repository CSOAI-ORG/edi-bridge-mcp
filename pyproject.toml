[project]
name = "edi-bridge-mcp"
version = "0.1.0"
description = "Bridge EDI X12 / EDIFACT B2B supply-chain messages to ONE OS — parse, validate, map, govern (Peppol/ViDA/SOX). CSOAI Layer-0 legacy-bridge family."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CSOAI-ORG"}]
dependencies = ["mcp>=1.0.0", "pydantic>=2.0.0"]
[project.scripts]
edi-bridge-mcp = "server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
